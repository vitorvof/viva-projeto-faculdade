<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel da Equipe de Plantão — Healix</title>
  <link rel="icon" href="{{ url_for('static', filename='healix-icon.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="app-header">
    <div class="brand">
      <div class="brand-icon">
        <img src="{{ url_for('static', filename='healix-icon.png') }}" alt="Healix" />
      </div>
      <div>
        <h1>Painel do Psicólogo de Plantão</h1>
        <div class="subtitle">Protótipo — Camada 3 (confirmação humana)</div>
      </div>
    </div>
    <div class="header-right">
      <div class="emergency-badges">
        <a class="emergency-badge" href="tel:188" title="CVV — Centro de Valorização da Vida, 24h">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.5 2.4.8 3.6.8.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.6c0-.6.4-1 1-1H7.6c.6 0 1 .4 1 1 0 1.3.3 2.5.8 3.6.1.4 0 .8-.2 1L6.6 10.8z"/></svg>
          CVV 188
        </a>
        <a class="emergency-badge" href="tel:192" title="SAMU — emergência médica, 24h">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.5 2.4.8 3.6.8.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.6c0-.6.4-1 1-1H7.6c.6 0 1 .4 1 1 0 1.3.3 2.5.8 3.6.1.4 0 .8-.2 1L6.6 10.8z"/></svg>
          SAMU 192
        </a>
      </div>
      <div class="painel-user">
        <span class="painel-user-name">{{ funcionario_nome }}</span>
        <form method="POST" action="{{ url_for('logout') }}">
          <button type="submit" class="painel-logout-btn">Sair</button>
        </form>
      </div>
    </div>
  </div>

  <div class="painel-wrap">
    <div class="filters">
      <button data-filter="aberto" class="active">Abertos</button>
      <button data-filter="em_atendimento">Em atendimento</button>
      <button data-filter="resolvido">Resolvidos</button>
      <button data-filter="todos">Todos</button>
    </div>

    <div class="alert-grid">
      <div id="alert-list" class="alert-list">
        <div class="empty-state">Carregando alertas...</div>
      </div>

      <div id="detail-panel" class="detail-panel">
        <div class="empty-state">Selecione um alerta na lista ao lado para ver a conversa completa.</div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='painel.js') }}"></script>
</body>
</html>
